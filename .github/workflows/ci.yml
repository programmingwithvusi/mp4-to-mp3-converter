name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes type-check via tsc -b)
        run: npm run build

      # No test suite exists yet (no "test" script in package.json).
      # Add Vitest + a "test" script, then a step here, when you're ready.
      - name: Test
        run: npm test

      - name: Build (includes type-check via tsc -b)
        run: npm run build